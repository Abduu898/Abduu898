
name: Update Contribution Count

on:
  schedule:
    - cron: "15 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/github-script@v7
        env:
          USERNAME: Abduu898
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require("fs");

            const query = `
              query($login: String!) {
                user(login: $login) {
                  contributionsCollection {
                    contributionCalendar {
                      totalContributions
                    }
                  }
                }
              }
            `;

            const data = await github.graphql(query, {
              login: process.env.USERNAME
            });

            const count =
              data.user.contributionsCollection
                .contributionCalendar.totalContributions;

            fs.mkdirSync("profile", { recursive: true });

            const svg = `
            <svg xmlns="http://www.w3.org/2000/svg"
                 width="495" height="130" viewBox="0 0 495 130">
              <rect width="494" height="129" x=".5" y=".5"
                    rx="10" fill="#0d1117" stroke="#30363d"/>
              <text x="25" y="35" fill="#8b949e"
                    font-family="Arial,sans-serif" font-size="14">
                CONTRIBUTIONS IN THE LAST YEAR
              </text>
              <text x="25" y="88" fill="#3fb950"
                    font-family="Arial,sans-serif" font-size="42"
                    font-weight="700">${count}</text>
              <text x="25" y="111" fill="#8b949e"
                    font-family="Arial,sans-serif" font-size="12">
                Based on GitHub's contribution calendar
              </text>
            </svg>`;

            fs.writeFileSync("profile/contributions.svg", svg);
            console.log(`Contribution count: ${count}`);

      - name: Commit updated SVG
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/contributions.svg
          git diff --cached --quiet || git commit -m "Update contribution count"
          git push
